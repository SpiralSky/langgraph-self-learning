[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "spiralsky", email = "shianastrophysics@gmail.com" }
]
dependencies = [
    "langchain==1.3.16",
    "langchain-community>=0.4.2",
    "langchain_core>=1.5.6",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "pydantic>=2.13.4",
    "mem0ai[nlp]>=2.0.18",
    "chromadb>=1.5.9",
    "duckduckgo-search>=8.1.1",
    "langserve>=0.3.3",
    "fastapi>=0.141.1",
    "ddgs>=9.15.0",
    "sse-starlette>=3.3.4",
    "langgraph-api==0.12.7",
    "langgraph-cli[inmem]>=0.4.31",
    "qdrant-client>=1.19.0",
    "spacy>=3.8.15",
    "fastembed>=0.8.0",
    "onnxruntime>=1.29.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "syrupy>=4.7",
    "httpx>=0.28",
    "ruff>=0.6",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
