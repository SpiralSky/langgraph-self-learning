name: code-exec-sandbox

networks:
  frontend-net:
    driver: bridge
  code-net:
    internal: true
  mgmt-net:
    driver: bridge

volumes:
  backend-data:

services:
  frontend:
    build: ./../agent-chat-ui
    networks: [frontend-net, mgmt-net]
    ports:
      - "3000:3000"
    environment:
      LANGGRAPH_API_URL: "http://backend:2024"
      NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
      # The assistant-ui frontend streams `messages`-mode events from the `chat`
      # graph (see backend/langgraph.json); `agent` is values-mode and renders
      # nothing in the chat view. Missing id → the setup form would appear.
      NEXT_PUBLIC_ASSISTANT_ID: "chat"
      # Same-origin /api/feedback proxy target (PostFeedback → /feedback on the
      # feedback-api service). Resolves via Docker DNS inside the proxy fetch.
      NEXT_PUBLIC_FEEDBACK_API_URL: "http://feedback-api:8000"
      LEDGER_PATH: "/shared/ledger"
    volumes:
      - ./ledger:/shared/ledger:ro
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "frontend"

  backend:
    build: ./../backend
    # API binds 0.0.0.0 (docker/entrypoint.sh) so frontend-net DNS + the published
    # port both work; code-runner has no wired integration yet.
    networks:
      - frontend-net
      - code-net
    ports:
      - "2024:2024"
    env_file:
      - ../backend/.env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:2024/info', timeout=2).getcode()==200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    volumes:
      - ../backend:/app
      - backend-data:/app/data
      - ./ledger:/shared/ledger:ro
      - ./keys/graph_to_code:/app/.ssh/graph_to_code:ro
      - ./workspace:/shared/workspace
    depends_on: [code-runner]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "backend"

  feedback-api:
    # Separate feedback FastAPI (backend/src/api/app.py, POST /feedback), served
    # on 8000 (not the langgraph server on 2024). The frontend proxies same-origin
    # /api/feedback → http://feedback-api:8000/feedback.
    build: ./../backend
    networks: [frontend-net]
    ports:
      - "8000:8000"
    entrypoint: ["uv", "run", "uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "feedback-api"

  code-runner:
    image: code-runner:base
    build:
      context: ./dockerfile/code-runner
    networks: [code-net]
    # Password SSH for host/user access only: bound to 127.0.0.1 (LAN-unreachable,
    # localhost-only) on a non-common port. Containers still reach code-runner via
    # code-net DNS:22 — the published port is not used for inter-container traffic.
    ports:
      - "127.0.0.1:22022:22"
    environment:
      SSH_PASSWORD_FILE: "/run/secrets/ssh_password"
    volumes:
      - ./workspace:/home/exec/workspace
      # password lives outside the repo; ro mount (entrypoint flips sshd to
      # password-only when this file is present, see dockerfile/code-runner/entrypoint.sh)
      - ../../other-data/ssh_passwords/code-runner.txt:/run/secrets/ssh_password:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    # per-command timeout enforced graph-side (task-02/task-07 policy)

  manager:
    image: docker:cli
    networks: [mgmt-net]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/shared
      - ./manager-entrypoint.sh:/usr/local/bin/manager-entrypoint.sh
    environment:
      COMPOSE_PROJECT_NAME: "code-exec-sandbox"
      MANAGER_ENTRYPOINT: "/usr/local/bin/manager-entrypoint.sh"
    entrypoint: ["/usr/local/bin/manager-entrypoint.sh"]
